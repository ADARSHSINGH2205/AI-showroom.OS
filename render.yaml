databases:
  - name: ai-showroom-os-db
    databaseName: ai_showroom_os
    user: showroom
    plan: free

services:
  - type: web
    name: ai-showroom-os-api
    runtime: docker
    plan: free
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    healthCheckPath: /ready
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: ai-showroom-os-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: SEED_OWNER_USERNAME
        sync: false
      - key: SEED_OWNER_PASSWORD
        sync: false
      - key: CORS_ORIGINS
        value: '["https://frontend-three-alpha-55.vercel.app"]'
      - key: ALLOWED_HOSTS
        value: '["*.onrender.com"]'
      - key: AI_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash
      - key: OWNER_MOBILE_NUMBER
        sync: false
      - key: SMS_PROVIDER
        value: console
      - key: TEXTBELT_API_KEY
        sync: false